name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Orchard.Tests -c Release

      - name: Publish Orchard.exe
        run: dotnet publish src/Orchard -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Smoke test (launch the shell, check it stays up, then quit and restore)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\Orchard.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Get-Content "$env:APPDATA\Orchard\orchard.log" -ErrorAction SilentlyContinue
            throw "Orchard exited early with code $($p.ExitCode)"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-desktop.png")
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3
          # The watchdog should have put the taskbar back; --restore is idempotent either way.
          publish\Orchard.exe --restore
          Get-Content "$env:APPDATA\Orchard\orchard.log" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Orchard-win-x64
          path: publish/Orchard.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-screenshot
          path: windows-desktop.png
          if-no-files-found: ignore

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Render UI screenshots headlessly
        run: dotnet run --project tools/Orchard.Screenshots -c Release -- out
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: out/*.png
